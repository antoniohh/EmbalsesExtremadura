name: Actualizar embalses y desplegar en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Actualización semanal: martes a las 20:35 UTC (21:35 CET / 22:35 CEST)
    # Retraso programado de unas 7 horas respecto a la publicación del MITECO
    # para garantizar datos disponibles y evitar saturación en GitHub Actions.
    - cron: "35 20 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar datos del MITECO
        run: npm run data

      - name: Compilar Astro
        run: npm run build

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
